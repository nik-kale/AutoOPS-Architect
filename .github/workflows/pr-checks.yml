name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-metadata:
    name: Check PR Metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Check if title follows conventional commits format
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|refactor|perf|security|test|chore|style|ci|build)(\(.+\))?: .+'; then
            echo "❌ PR title must follow conventional commits format:"
            echo "   feat: add new feature"
            echo "   fix: resolve bug"
            echo "   docs: update documentation"
            echo "   etc."
            echo ""
            echo "Current title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title follows conventional commits format"

      - name: Check PR description
        run: |
          DESCRIPTION="${{ github.event.pull_request.body }}"

          if [ -z "$DESCRIPTION" ] || [ ${#DESCRIPTION} -lt 50 ]; then
            echo "❌ PR description is too short (minimum 50 characters)"
            echo "   Please provide a meaningful description of your changes"
            exit 1
          fi

          echo "✅ PR description is adequate"

      - name: Check for breaking changes
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Check if breaking change is indicated
          if echo "$PR_TITLE" | grep -qE '!:' || echo "$PR_BODY" | grep -qiE 'breaking change'; then
            echo "⚠️  This PR contains breaking changes"
            echo "   Ensure version bump follows semantic versioning (major version increment)"
            # This is just a warning, not a failure
          fi

  check-files:
    name: Check Modified Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41

      - name: Check for large files
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ $size -gt 1048576 ]; then  # 1MB
                echo "❌ File $file is too large ($(($size / 1024))KB)"
                echo "   Consider using Git LFS for large files"
                exit 1
              fi
            fi
          done
          echo "✅ No large files detected"

      - name: Check for sensitive files
        run: |
          SENSITIVE_PATTERNS="*.pem *.key *.env .env.* *.p12 *.pfx id_rsa id_dsa"

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            for pattern in $SENSITIVE_PATTERNS; do
              if echo "$file" | grep -q "$pattern"; then
                echo "❌ Potentially sensitive file detected: $file"
                exit 1
              fi
            done
          done
          echo "✅ No sensitive files detected"

  test-coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=autoops_architect --cov-report=term --cov-report=json

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(data['totals']['percent_covered'])")
          echo "Coverage: $COVERAGE%"

          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          fi

          echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"

      - name: Comment coverage on PR
        if: always()
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0

